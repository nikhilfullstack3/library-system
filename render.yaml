services:
  - type: web
    runtime: node
    name: library-system-api
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: QR_SECRET
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: 600
